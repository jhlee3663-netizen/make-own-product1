<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Smart Pin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@600,700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #FAFAFA;
        color: #0A0A0A;
        -webkit-font-smoothing: antialiased;
      }
      button, input, textarea, select {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #E8E8EC; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #9C9C9C; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
