<div id="root"></div>
<script>
const c = new URLSearchParams(location.search).get('c') || 'a';
const top2 = `<div class="head"><b>10월 8일 목 ▾</b><span>할 일</span></div><div class="tabs"><div>운동</div><div class="on">식단</div></div>`;
const intake = (kcal, pct, add = 0) => `<div class="card"><span class="t">섭취 칼로리</span><div class="kcal"><b>${kcal}</b><span>/ 2,100kcal</span></div>
  <div class="bar"><em></em><i style="width:${pct}%"></i>${add ? `<i class="add" style="left:${pct}%;width:${add}%"></i>` : ''}</div>
  <div class="macros"><span>탄수<b>${add ? 178 : 96}g</b></span><span>단백질<b>${add ? 71 : 48}g</b></span><span>지방<b>${add ? 44 : 22}g</b></span></div></div>`;
const meal = (k, n, t, opt = {}) => `<div class="meal ${opt.new ? 'new' : ''}"><div class="k ${k ? '' : 'none'}">${k || 0}<small>kcal</small></div><div class="tx"><b>${n}</b><span class="${k ? '' : 'none'}">${t}</span></div>${opt.noPlus ? '' : `<div class="plus ${opt.hot ? 'hot' : ''}">+</div>`}</div>`;
const meals = (lunch, opt = {}) => `<div class="card">${meal(320, '아침', '그릭요거트, 바나나', { noPlus: opt.noPlus })}${lunch}${meal(0, '저녁', '아직 기록이 없어요', { noPlus: opt.noPlus })}</div>`;
const phone = inner => `<div class="phone">${inner}</div>`;
const col = (cap, sub, inner) => `<div class="col"><div class="cap">${cap}<small>${sub}</small></div>${phone(inner)}</div>`;
