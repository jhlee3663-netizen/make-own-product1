<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><title>카드 눌림 효과 미리보기</title></head>
<body style="margin:0;background:#f8f9fa"><div id="root"></div>
<script type="module">
/* 카드를 직접 눌러볼 수 있다. ?auto 를 붙이면 0.3초 뒤 자동으로 누른 상태가 된다(스크린샷용). */
import React from 'react';
import { createRoot } from 'react-dom/client';
import '../src/index.css';
import PressCard from '../src/components/common/PressCard';
const h = React.createElement;
const chip = t => h('span', { key: Math.random(), className: 'px-4 py-2 rounded-full bg-ui-2 font-pretendard text-[13px] text-typo-normal whitespace-nowrap' }, t);
function Card() {
  return h(PressCard, { className: 'bg-white shadow-[0_0_25px_rgba(3,27,38,0.08)] cursor-pointer', onClick() {} },
    h('div', { className: 'p-4 flex flex-col gap-4' },
      h('div', { className: 'flex items-center justify-between' },
        h('span', { className: 'px-2 py-1 rounded-[8px] bg-[#7171FF]/10 font-pretendard text-[13px] text-[#7171FF]' }, '성공 🔥'),
        h('button', { className: 'w-6 h-6 text-ui-6' }, '···')),
      h('div', { className: 'flex items-center justify-between' },
        h('p', { className: 'font-pretendard font-bold text-[17px] text-typo-strong' }, '가슴+ 전면어깨'),
        h('p', { className: 'font-pretendard text-[13px] text-typo-alternative' }, '25. 1. 9')),
      h('div', { className: 'flex gap-2 overflow-hidden' }, ['운동 종목', '운동 종목', '운동 종목', '운동 종목'].map(chip))),
    h('div', { className: 'px-4 py-3.5 border-t border-ui-2 font-pretendard text-[13px] text-[#7171FF]' }, '❝  계획대로 완벽하게 했어요. 내일도 달려봅시다!'));
}
createRoot(document.getElementById('root')).render(h('div', { style: { width: 402, margin: '0 auto', padding: '24px 16px', boxSizing: 'border-box' } }, h(Card)));
if (new URLSearchParams(location.search).has('auto')) {
  setTimeout(() => {
    const el = document.querySelector('#root .relative');
    const r = el.getBoundingClientRect();
    el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'mouse', button: 0, clientX: r.left + 100, clientY: r.top + 60 }));
  }, 300);
}
</script></body></html>
