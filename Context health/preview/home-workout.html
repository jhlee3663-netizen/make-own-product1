<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 운동 탭 요약 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Pretendard, 'Apple SD Gothic Neo', sans-serif; background: #e9ecef; padding: 32px; letter-spacing: -0.025em; color: #171a1d; }
  .wrap { display: flex; gap: 40px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 15px; font-weight: 700; color: #495057; }
  .cap small { display: block; font-weight: 500; font-size: 13px; color: #868e96; margin-top: 2px; }
  .phone { width: 390px; height: 844px; background: #7171ff; border-radius: 28px; overflow: hidden; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,.12); }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 28px 20px 14px; color: #fff; }
  .head b { font-size: 20px; font-weight: 700; }
  .head span { font-size: 14px; font-weight: 600; opacity: .85; }
  .week { display: flex; padding: 0 8px 14px; }
  .day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; }
  .day span { font-size: 12px; opacity: .8; }
  .day b { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
  .day.on b { background: #fff; color: #7171ff; }
  .day.future b { opacity: .4; }
  .day em { width: 5px; height: 5px; border-radius: 50%; }
  .day.did em { background: #fff; }
  .tabs { display: flex; padding: 0 24px; }
  .tabs div { flex: 1; text-align: center; padding: 10px 0; font-size: 16px; font-weight: 600; color: #fff; border-radius: 20px 20px 0 0; }
  .tabs .on { background: #f8f9fa; color: #7171ff; font-weight: 700; }
  .sheet { background: #f8f9fa; border-radius: 24px 24px 0 0; height: 100%; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .two { display: flex; gap: 12px; }
  .two > * { flex: 1; min-width: 0; }
  .card { background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 2px 12px rgba(3,27,38,.05); }
  .t { font-size: 13px; font-weight: 600; color: #868e96; }
  .small { height: 86px; display: flex; flex-direction: column; justify-content: space-between; }
  .small .v { font-size: 20px; font-weight: 700; } .small .v small { font-size: 12px; font-weight: 600; color: #03b26c; margin-left: 6px; }
  .link { font-size: 13px; font-weight: 700; color: #7171ff; align-self: flex-end; }
  .grid { margin-top: 10px; display: grid; grid-template-columns: 30px repeat(7, 1fr); row-gap: 5px; align-items: center; font-size: 11px; color: #868e96; }
  .grid i { width: 9px; height: 9px; border-radius: 50%; background: #f1f3f5; justify-self: center; }
  .grid i.on { background: #7171ff; }
  .grid .h { font-size: 9px; color: #adb5bd; text-align: center; }
  .big { font-size: 22px; font-weight: 700; margin-top: 8px; } .big small { font-size: 12px; font-weight: 500; color: #868e96; margin-left: 4px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 54px; margin-top: 14px; }
  .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; color: #adb5bd; justify-content: flex-end; height: 100%; }
  .bars i { width: 100%; border-radius: 4px 4px 0 0; background: rgba(113,113,255,.2); min-height: 2px; }
  .bars .on i { background: #7171ff; }
  .rowhead { display: flex; justify-content: space-between; align-items: baseline; }
  .rowhead b { font-size: 16px; font-weight: 700; } .rowhead span { font-size: 12px; color: #868e96; }
  .parts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .part { border-radius: 14px; padding: 10px 12px; background: #f8f9fa; }
  .part b { display: block; font-size: 14px; font-weight: 700; } .part span { font-size: 12px; color: #868e96; font-weight: 500; }
  .part.mid { background: rgba(113,113,255,.1); } .part.mid span { color: #7171ff; }
  .part.hot { background: #7171ff; } .part.hot b, .part.hot span { color: #fff; }
  .cardio { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f1f3f5; font-size: 13px; color: #495057; font-weight: 600; }
  .cardio span { color: #868e96; font-weight: 500; }
  .label { font-size: 12px; font-weight: 600; color: #868e96; padding: 4px 4px 0; display: flex; align-items: center; gap: 8px; }
  .label::after { content: ''; flex: 1; height: 1px; background: #e9ecef; }
  .log .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: rgba(113,113,255,.1); color: #7171ff; }
  .log .title { display: flex; justify-content: space-between; margin-top: 10px; align-items: baseline; } .log .title b { font-size: 18px; } .log .title span { font-size: 13px; color: #868e96; }
  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.05); display: flex; align-items: center; justify-content: space-around; font-size: 11px; color: #ced4da; font-weight: 600; }
  .nav .on { color: #7171ff; } .fab { width: 52px; height: 52px; border-radius: 50%; background: #7171ff; margin-top: -28px; }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
const DAYS = ['월', '화', '수', '목', '금', '토', '일'], NUMS = [5, 6, 7, 8, 9, 10, 11];
const header = `<div class="head"><b>10월 7일 수 ▾</b><span>할 일</span></div>
  <div class="week">${NUMS.map((n, i) => `<div class="day ${n === 7 ? 'on' : ''} ${n > 7 ? 'future' : ''} ${n < 7 ? 'did' : ''}"><span>${DAYS[i]}</span><b>${n}</b><em></em></div>`).join('')}</div>
  <div class="tabs"><div class="on">운동</div><div>식단</div></div>`;
const top2 = `<div class="two">
  <div class="card small"><span class="t">아침 공복 체중</span><span class="v">72.1kg<small>−0.2</small></span></div>
  <div class="card small"><span class="t">오늘의 운동 기록</span><span class="link">기록하기</span></div></div>`;
const log = `<div class="label">이전 기록</div><div class="card log"><span class="badge">아쉬워요 💭</span><div class="title"><b>삼두, 이두, 유산소</b><span>10. 6</span></div></div>`;
const nav = `<div class="nav"><span class="on">홈</span><span>코치</span><div class="fab"></div><span>분석</span><span>마이</span></div>`;

// 최근 7일 (10/1~10/7) 부위별 운동 여부
const HEAT = [['가슴', [1, 0, 0, 0, 0, 0, 0]], ['등', [0, 0, 0, 0, 0, 0, 0]], ['하체', [0, 0, 0, 1, 0, 0, 0]], ['어깨', [0, 0, 0, 0, 0, 0, 0]], ['팔', [0, 0, 0, 0, 0, 1, 0]]];
const heat = `<div class="card"><span class="t">헬스 · 최근 7일</span><div class="grid"><span></span>${[1, 2, 3, 4, 5, 6, 7].map(d => `<span class="h">${d}</span>`).join('')}
  ${HEAT.map(([p, row]) => `<span>${p}</span>${row.map(v => `<i class="${v ? 'on' : ''}"></i>`).join('')}`).join('')}</div></div>`;
const CARDIO = [0, 0, 0, 0, 30, 30, 0];
const cardio = `<div class="card"><span class="t">유산소 · 최근 7일</span><div class="big">60분<small>2회</small></div>
  <div class="bars">${CARDIO.map((v, i) => `<div class="${v && i >= 5 ? 'on' : ''}"><i style="height:${v}px"></i>${i + 1}</div>`).join('')}</div></div>`;

const REST = [['가슴', '6일 전', 'hot'], ['등', '8일 전', 'hot'], ['하체', '3일 전', 'mid'], ['어깨', '22일 전', 'hot'], ['팔', '어제', ''], ['유산소', '어제', '']];
const full = `<div class="card"><div class="rowhead"><b>오늘은 등·어깨 할 차례예요</b><span>최근 7일</span></div>
  <div class="parts">${REST.map(([p, d, c]) => `<div class="part ${c}"><b>${p}</b><span>${d}</span></div>`).join('')}</div>
  <div class="cardio">이번 주 운동 3일<span>볼륨 15,711kg · 유산소 60분</span></div></div>`;

const frames = [
  ['A. 반쪽 두 개 (헬스 | 유산소)', '어느 날 어느 부위를 했는지 점으로 표시', `<div class="two">${heat}${cardio}</div>`],
  ['B. 전체 폭 한 개 (얼마나 쉬었나)', '오래 쉰 부위일수록 진하게 → 오늘 할 부위가 보임', full],
];
document.getElementById('root').innerHTML = frames.map(([cap, sub, mid]) => `<div class="col"><div class="cap">${cap}<small>${sub}</small></div>
  <div class="phone">${header}<div class="sheet">${top2}${mid}${log}</div>${nav}</div></div>`).join('');
</script>
</body>
</html>
