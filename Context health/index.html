<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <title>Context Health</title>
    <script>
      /* 카카오톡·인스타그램 등 앱 안 브라우저에서는 구글 로그인이 막히고 저장소도 따로라
         초대·공유 링크가 끊긴다. 열리자마자 기본 브라우저로 같은 주소를 다시 연다. */
      (function () {
        var ua = navigator.userAgent || '';
        var url = location.href;
        if (/KAKAOTALK/i.test(ua)) {
          location.replace('kakaotalk://web/openExternal?url=' + encodeURIComponent(url));
          return;
        }
        var inApp = /Instagram|FBAN|FBAV|NAVER\(inapp|Line\/|everytimeApp|DaumApps/i.test(ua);
        if (inApp && /Android/i.test(ua)) {
          location.replace('intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end');
        }
      })();
    </script>
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#3aa0ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#3aa0ff" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Context Health" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #ffffff;
      }

      body {
        min-height: 100dvh;
      }

      /* 앱 코드가 뜨기 전에도 시작 화면과 같은 배경이 먼저 보이게 한다 */
      .app-boot-loader {
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        background: #f1f3f5;
      }

      .app-boot-splash {
        width: 100%;
        max-width: 430px;
        min-height: 100dvh;
        background: linear-gradient(to bottom right, #3aa0ff, #f79fff);
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" class="app-boot-loader" aria-label="앱을 불러오는 중">
      <div class="app-boot-splash"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
