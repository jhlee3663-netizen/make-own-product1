<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <title>Context Health</title>
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Context Health" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #ffffff;
      }

      body {
        min-height: 100dvh;
      }

      .app-boot-loader {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }

      .app-boot-spinner {
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        border: 2px solid rgba(52, 118, 238, 0.2);
        border-top-color: #3476ee;
        animation: appBootSpin 0.8s linear infinite;
      }

      @keyframes appBootSpin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
    <script type="text/javascript" src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" aria-label="앱을 불러오는 중">
        <div class="app-boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
